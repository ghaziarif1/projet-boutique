spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: produits-service
          uri: lb://produits-service
          predicates:
            - Path=/api/produits/**,/api/categories/**
        - id: avis-service
          uri: lb://avis-service
          predicates:
            - Path=/api/avis/**

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
  instance:
    prefer-ip-address: true

server:
  port: 8090

management:
  endpoints:
    web:
      exposure:
        include: health,info
