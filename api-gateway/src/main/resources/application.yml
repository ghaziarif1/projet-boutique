spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes: []

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
  instance:
    prefer-ip-address: true

server:
  port: 8090

management:
  endpoints:
    web:
      exposure:
        include: health,info
