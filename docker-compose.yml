services:
  postgres-produits:
    image: postgres:15
    environment:
      POSTGRES_DB: produitsdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-produits-data:/var/lib/postgresql/data

  postgres-avis:
    image: postgres:15
    environment:
      POSTGRES_DB: avisdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-avis-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - '6379:6379'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    command: redis-server --appendonly yes

  eureka-server:
    build:
      context: .
      dockerfile: ./eureka-server/Dockerfile
    ports:
      - '8761:8761'
    depends_on:
      - postgres-produits
      - postgres-avis
      - redis

  produits-service:
    build:
      context: .
      dockerfile: ./produits-service/Dockerfile
    ports:
      - '8091:8091'
    depends_on:
      postgres-produits:
        condition: service_started
      redis:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      SPRING_REDIS_TIMEOUT: 10000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8091/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  avis-service:
    build:
      context: .
      dockerfile: ./avis-service/Dockerfile
    ports:
      - '8092:8092'
    depends_on:
      - postgres-avis
      - eureka-server

  api-gateway:
    build:
      context: .
      dockerfile: ./api-gateway/Dockerfile
    ports:
      - '8090:8090'
    depends_on:
      - eureka-server
      - produits-service
      - avis-service

volumes:
  postgres-produits-data:
  postgres-avis-data:
